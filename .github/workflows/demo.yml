name: Publish interactive demonstration
on:
  push:
    branches: [main]
    paths: ['updated/demo/**', '.github/workflows/demo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: updated/demo
      - id: deployment
        uses: actions/deploy-pages@v4
